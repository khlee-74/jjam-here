:root{--ink:#142b35;--muted:#718087;--paper:#f6f5f0;--card:#fffefa;--line:#e5e5dc;--accent:#2f7168;--accent2:#d8ebe3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:var(--paper);color:var(--ink)}
body{display:flex;justify-content:center}.app{width:100%;max-width:520px;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 2px 16px}.brand{font-size:22px;font-weight:850;letter-spacing:-1.2px}.brandrow{display:flex;align-items:center;gap:10px}.company-logo{display:block;width:108px;height:auto;max-height:42px;object-fit:contain;background:#fff;border-radius:5px;padding:2px}.brandtitle{font-size:19px;font-weight:850;letter-spacing:-1px}.brandtitle span{color:#4b8a7d}.subbrand{font-size:11px;color:var(--muted);margin-top:3px}.topbtn{border:1px solid var(--line);background:#fffefa;border-radius:99px;padding:9px 12px;font-size:12px;color:var(--ink)}
main{flex:1;display:flex;flex-direction:column;gap:14px}.welcome{font-size:13px;color:var(--muted);padding:0 2px}.chips{display:flex;gap:7px;overflow-x:auto;padding:1px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;border-radius:99px;padding:9px 13px;font-size:12px;color:#66747a}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid #e9e8df;border-radius:27px;min-height:430px;flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:25px 23px 21px;box-shadow:0 10px 35px #213c3a0b;position:relative;overflow:hidden;touch-action:pan-y;transition:transform .18s ease,opacity .18s ease}
.card:before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;background:var(--wash,#e4eee7);right:-90px;top:-95px;opacity:.75}.card>*{position:relative}.cardtop{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{font-size:11px;font-weight:750;letter-spacing:.2px;background:var(--wash,#e4eee7);padding:8px 11px;border-radius:99px}.count{font-size:11px;color:#899397}.art{font-size:53px;margin:25px 0 17px;filter:saturate(.9)}.eyebrow{font-size:12px;color:var(--accent);font-weight:750;margin-bottom:10px}.headline{font-size:clamp(25px,7vw,34px);line-height:1.42;letter-spacing:-1.2px;font-weight:820;white-space:pre-line;overflow-wrap:break-word}.bodycopy{font-size:15px;line-height:1.8;color:#58666b;margin-top:16px;white-space:pre-line}.tinyaction{font-size:12px;line-height:1.6;color:#758287;background:#f6f5f0;border-radius:14px;padding:12px 14px;margin-top:19px}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:15px}.actiongroup{display:flex;gap:8px}.iconbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;background:#fffefa;padding:11px 13px;font-size:12px;color:var(--ink)}.iconbtn.on{background:var(--accent2);border-color:#c6ded3;color:#225e51}.nextbtn{border:0;border-radius:99px;background:var(--ink);color:white;padding:13px 18px;font-weight:750;font-size:13px;display:flex;align-items:center;gap:8px}.hint{text-align:center;color:#9aa2a3;font-size:11px;padding:0 0 8px}.bottomnav{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:12px 0 calc(10px + env(safe-area-inset-bottom));margin:10px -18px 0;background:#f6f5f0}.navbtn{background:none;border:0;color:#879194;font-size:11px;display:flex;align-items:center;flex-direction:column;gap:5px;padding:5px 16px}.navbtn span:first-child{font-size:19px}.navbtn.active{color:var(--accent);font-weight:800}.view-title{font-size:24px;font-weight:850;letter-spacing:-.8px;margin:10px 2px 0}.view-desc{font-size:13px;color:var(--muted);line-height:1.7;margin:0 2px 8px}.savedlist{display:flex;flex-direction:column;gap:10px}.saveditem{border:1px solid var(--line);background:var(--card);border-radius:17px;padding:15px;text-align:left;color:var(--ink)}.saveditem .smalltag{font-size:10px;color:var(--accent);font-weight:750}.saveditem strong{display:block;font-size:16px;line-height:1.5;margin:7px 0}.saveditem small{color:var(--muted);line-height:1.5}.empty{padding:35px 20px;text-align:center;color:var(--muted);line-height:1.8;border:1px dashed #d8ddd7;border-radius:20px}.hidden{display:none!important}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#142b35;color:#fff;padding:11px 16px;border-radius:99px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;white-space:nowrap}.toast.show{opacity:1}.footer-note{font-size:10px;color:#a1a7a5;text-align:center;padding:7px 0 0}
@media(min-height:850px){.card{min-height:500px;padding:30px}.art{margin:38px 0 22px}}@media(max-height:700px){.card{min-height:355px;padding:20px}.art{font-size:42px;margin:15px 0 10px}.headline{font-size:27px}.bodycopy{font-size:14px;margin-top:10px}.tinyaction{margin-top:12px;padding:9px 12px}}

{c:"재미와 웃음",e:"가벼운 상상",a:"🦆",h:"오리는 물 위에서 평온하다.\\n물밑에선 열심히 발을 젓는다.",b:"사람도 겉으로 보이지 않는 노력을 하고 있을 수 있어요. 남의 평온한 모습만 보고 내 삶을 비교하지 않아도 돼요.",x:"남에게 보이지 않는 내 노력 하나를 인정해 주세요.",w:"#f7e7d7"},
{c:"재미와 웃음",e:"오늘의 농담",a:"🪴",h:"식물에게 말을 걸었다.\\n적어도 내 말을 끊지는 않았다.",b:"식물을 돌보는 시간은 작은 리듬을 만들어 줘요. 누군가에게 말을 걸기 어려운 날엔 조용한 생명 곁에 있어도 좋아요.",x:"주변의 작은 생명이나 물건을 정성껏 돌봐보세요.",w:"#f7e7d7"},
{c:"재미와 웃음",e:"느긋한 하루",a:"🍞",h:"토스트가 조금 탔다.\\n오늘의 바삭함은 충분하다.",b:"계획대로 되지 않은 결과도 가끔은 나쁘지 않아요. 모든 것을 완벽하게 통제할 수는 없으니까요.",x:"작은 실수를 오늘의 웃긴 에피소드로 바꿔보세요.",w:"#f7e7d7"},
{c:"재미와 웃음",e:"공감 한 컷",a:"🧠",h:"자기 전에 갑자기 떠오르는\\n10년 전의 민망한 기억.",b:"뇌는 가끔 오래된 장면을 불쑥 꺼내 놓습니다. 그때의 나는 지금보다 경험이 적었어요. 이미 지나간 장면을 오늘 다시 벌줄 필요는 없어요.",x:"‘그때의 나는 그때의 나였다’고 속으로 말해보세요.",w:"#f7e7d7"},
{c:"재미와 웃음",e:"작은 발견",a:"🪑",h:"의자에 앉는 순간\\n세상에서 제일 중요한 일은 앉기.",b:"잠깐 앉아 숨을 돌리는 건 게으름이 아니라 에너지를 회복하는 방법일 수 있어요.",x:"어깨 힘을 빼고 편하게 앉아 세 번 숨 쉬기.",w:"#f7e7d7"},
{c:"재미와 웃음",e:"느슨한 유머",a:"🧋",h:"오늘의 계획: 계획을\\n너무 많이 세우지 않기.",b:"계획표를 완성하는 데 하루를 다 쓰면 정작 하루를 살 시간이 부족해져요.",x:"오늘 꼭 해야 할 일 세 가지만 남겨보세요.",w:"#f7e7d7"},
{c:"재미와 웃음",e:"일상 공감",a:"🕰️",h:"주말은 짧고\\n월요일은 긴 것 같다.",b:"기대하는 시간과 해야 하는 시간은 다르게 느껴질 수 있어요. 그래서 평일에도 작은 즐거움을 남겨두는 게 중요하죠.",x:"내일을 위한 작은 즐거움 하나를 미리 정해두세요.",w:"#f7e7d7"},
{c:"재미와 웃음",e:"작은 유머",a:"🥬",h:"건강하게 먹으려고 샀는데\\n냉장고에서 건강하게 자라고 있다.",b:"좋은 의도도 실천할 방법이 있어야 현실이 되죠. 사두는 것보다 쉽게 먹을 수 있게 준비하는 게 더 효과적일 때가 많아요.",x:"냉장고 속 채소 하나를 오늘 식사에 넣어보세요.",w:"#f7e7d7"},
{c:"재미와 웃음",e:"마음 풀기",a:"🎧",h:"노래 한 곡으로\\n기분이 조금 바뀌는 날.",b:"음악은 기억과 감정에 연결되곤 해요. 어떤 날에는 긴 설명보다 익숙한 멜로디가 먼저 위로가 됩니다.",x:"지금 기분에 어울리는 노래 한 곡을 들어보세요.",w:"#f7e7d7"},
{c:"재미와 웃음",e:"소소한 행복",a:"🍊",h:"귤을 까는 동안만큼은\\n답장이 늦어도 괜찮다.",b:"손으로 무언가를 천천히 하는 시간은 잠깐 속도를 낮추게 해요. 모든 알림에 즉시 반응할 필요는 없어요.",x:"간식 하나를 화면 없이 천천히 먹어보기.",w:"#f7e7d7"},
{c:"재미와 웃음",e:"마지막 한 번 웃기",a:"🦥",h:"오늘의 목표는\\n어제보다 1% 덜 급하기.",b:"큰 변화보다 작은 조절이 오래 이어질 수 있어요. 느려지는 게 아니라 내 속도를 찾는 거예요.",x:"한 가지 일만 조금 덜 서두르며 해보세요.",w:"#f7e7d7"},
{c:"호기심 발견",e:"자연의 신비",a:"🌳",h:"나무는 매년 조금씩\\n자기만의 기록을 남겨요.",b:"많은 나무의 줄기에는 나이테가 생겨요. 성장 환경에 따라 폭과 모양이 달라질 수 있어 나무가 지나온 시간을 엿볼 단서가 됩니다.",x:"주변 나무 한 그루를 잠깐 관찰해 보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"우주의 크기",a:"🌙",h:"달빛은 달에서 출발해\\n약 1.3초 만에 지구에 와요.",b:"빛은 초당 약 30만 킬로미터를 이동해요. 우주에서는 그 빠른 빛도 거리를 느끼게 해주는 시계가 됩니다.",x:"오늘 밤 달을 본다면 빛이 여행해 온 시간을 떠올려 보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"동물 이야기",a:"🐙",h:"문어는 심장이 세 개예요.",b:"문어는 아가미로 혈액을 보내는 심장 두 개와 몸 전체로 보내는 심장 하나를 가지고 있어요. 바다에는 우리가 아직 모르는 신기한 생물이 많습니다.",x:"오늘 처음 알게 된 사실을 누군가에게 하나 들려주세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"감각의 세계",a:"👃",h:"익숙한 냄새가\\n기억을 불러올 때가 있어요.",b:"후각은 감정과 기억을 처리하는 뇌 영역과 밀접하게 연결돼 있어요. 그래서 특정 냄새가 오래전 장면을 생생하게 떠올리게 하기도 합니다.",x:"기분 좋은 향이나 익숙한 차 향을 천천히 느껴보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"하늘의 색",a:"🌅",h:"해 질 무렵 하늘이 붉어지는 건\\n빛이 지나오는 길과 관련 있어요.",b:"대기에서 짧은 파장의 푸른빛이 더 많이 산란되고, 해가 낮게 있을 때 빛은 더 긴 경로를 지나며 붉은 계열이 두드러질 수 있어요.",x:"다음 노을을 볼 때 색이 어떻게 바뀌는지 살펴보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"우리 몸",a:"👣",h:"걷기는 몸뿐 아니라\\n생각을 정리하는 데도 도움이 될 수 있어요.",b:"가벼운 걷기는 기분 전환과 주의 전환에 도움이 될 수 있습니다. 꼭 멀리 갈 필요는 없어요.",x:"가능하다면 3분만 걸으며 주변의 색 세 가지를 찾아보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"언어의 재미",a:"💬",h:"새로운 단어 하나가\\n세상을 보는 렌즈가 되기도 해요.",b:"이름을 붙이면 막연했던 경험을 구체적으로 생각하기 쉬워집니다. 언어를 배우는 건 표현의 선택지를 늘리는 일이기도 하죠.",x:"오늘 마음에 드는 단어 하나를 새로 배워보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"바다의 이야기",a:"🌊",h:"파도는 바닷물이 통째로\\n해변으로 달려오는 것만은 아니에요.",b:"파도는 주로 에너지가 이동하는 현상이에요. 물 입자는 파도 속에서 대체로 원형이나 타원형에 가까운 움직임을 합니다.",x:"해변에 있다면 파도가 오고 물러가는 리듬을 관찰해 보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"식물의 전략",a:"🌻",h:"식물은 빛을 향해\\n자라는 방향을 바꾸기도 해요.",b:"식물의 줄기는 빛의 방향에 반응해 성장 방향을 바꿀 수 있어요. 이를 굴광성이라고 부릅니다.",x:"창가 식물이 빛을 향해 어떻게 자라는지 살펴보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"작은 수수께끼",a:"🧩",h:"가질수록 더 많이 나누게 되는 건?",b:"정답은 ‘웃음’일 수 있겠네요. 웃음은 혼자 즐길 수도 있지만, 함께 나눌 때 분위기를 바꾸기도 합니다.",x:"오늘 누군가에게 작은 미소를 건네보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"빛과 그림자",a:"☀️",h:"그림자는 빛이 있어야\\n생길 수 있어요.",b:"빛이 물체에 가려지면 뒤쪽에 어두운 영역이 생깁니다. 빛의 위치가 달라지면 그림자의 길이와 방향도 바뀌어요.",x:"햇빛이 있는 곳에서 그림자의 모양을 잠깐 살펴보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"기억의 방식",a:"🧠",h:"기억은 동영상 파일처럼\\n그대로 저장되는 게 아니에요.",b:"기억을 떠올리는 과정에는 재구성이 들어갈 수 있어요. 그래서 같은 사건도 시간이 지나며 다르게 기억되기도 합니다.",x:"오래된 기억을 이야기할 때 ‘내가 기억하기로는’이라고 여지를 남겨보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"동물의 감각",a:"🦇",h:"박쥐 중 많은 종은\\n초음파로 주변을 파악해요.",b:"박쥐는 소리를 내고 돌아오는 메아리를 분석해 장애물이나 먹이의 위치를 알아내는 반향정위를 사용합니다.",x:"눈에 보이는 것 말고도 세상을 알아가는 방법이 많다는 걸 기억해요.",w:"#e2edf8"},
{c:"호기심 발견",e:"시간의 느낌",a:"⌛",h:"재미있는 순간은 짧게,\\n지루한 순간은 길게 느껴지죠.",b:"주의가 어디에 가 있는지, 감정이 어떤지에 따라 시간의 주관적인 느낌이 달라질 수 있어요.",x:"오늘의 좋은 순간 하나를 서두르지 말고 충분히 느껴보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"구름 관찰",a:"☁️",h:"구름은 하늘에 떠 있는\\n작은 물방울과 얼음 결정의 모임이에요.",b:"공기 중 수증기가 응결해 작은 물방울이나 얼음 결정이 되면 구름이 형성됩니다. 모양은 기온과 습도 등 조건에 따라 달라져요.",x:"구름을 보며 어떤 모양이 떠오르는지 상상해 보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"숫자의 재미",a:"🔢",h:"0은 ‘아무것도 없음’을\\n표현하면서 계산을 바꿨어요.",b:"0은 수 체계와 계산에서 중요한 역할을 합니다. 자릿값을 표현하는 데도 핵심적이죠. 단순한 기호 하나가 수학을 크게 확장했어요.",x:"당연해 보이는 것 중 우리 삶을 바꾼 발명 하나를 떠올려 보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"소리의 여행",a:"🔔",h:"소리는 공기 같은 매질을 통해\\n진동으로 전달돼요.",b:"소리는 진동이 주변 매질을 따라 전파되는 현상입니다. 진공에서는 공기 같은 매질이 없어 일반적인 소리가 전달되지 않아요.",x:"잠깐 조용히 주변 소리 세 가지를 구분해 들어보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"바람의 방향",a:"🍃",h:"바람은 공기가 움직이는 것이고\\n그 움직임에는 여러 이유가 있어요.",b:"기압 차이는 공기를 움직이게 하는 중요한 요인입니다. 지형과 온도, 지구의 자전도 바람의 흐름에 영향을 줍니다.",x:"바깥에 있다면 바람이 어느 방향에서 오는지 느껴보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"작은 퀴즈",a:"❓",h:"비가 오기 전에 흙냄새가\\n더 잘 느껴질 때가 있어요. 왜일까요?",b:"비가 땅에 닿을 때 흙과 식물에서 나온 여러 향기 성분이 공기 중으로 퍼질 수 있어요. 이런 비 온 뒤의 흙냄새를 ‘페트리코르’라고 부르기도 합니다.",x:"정답을 알게 됐다면 다음 비 오는 날 냄새를 천천히 느껴보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"바다 생물",a:"🐬",h:"돌고래는 소리로\\n서로 소통하고 주변을 탐색해요.",b:"돌고래는 다양한 소리와 몸짓을 사용합니다. 종과 상황에 따라 신호의 기능도 달라질 수 있어요.",x:"사람 사이에서도 말뿐 아니라 표정과 몸짓이 중요하다는 걸 떠올려 보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"작은 관찰",a:"🪨",h:"돌 하나도 오랜 시간과\\n환경의 흔적을 품고 있어요.",b:"암석은 생성과 풍화, 침식 등 여러 과정을 거치며 형태가 바뀝니다. 눈앞의 작은 돌도 긴 지구의 역사와 연결돼 있어요.",x:"주변에서 질감이나 모양이 독특한 물건 하나를 찾아보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"마음의 실험",a:"🎈",h:"숨을 천천히 내쉬면\\n잠시 속도를 낮추는 데 도움이 될 수 있어요.",b:"편안한 호흡은 긴장을 조절하는 데 도움이 될 수 있지만, 모든 상황을 해결하는 마법은 아니에요. 무리하지 않는 속도로 해보세요.",x:"편안하다면 숨을 들이마시고, 조금 더 천천히 내쉬어 보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"하루의 관찰",a:"🪟",h:"같은 창밖도\\n시간에 따라 다른 풍경이 돼요.",b:"빛과 날씨, 사람들의 움직임이 바뀌면 익숙한 장소도 다르게 보입니다. 새로운 곳에 가야만 새로움을 만나는 건 아니죠.",x:"늘 보던 풍경에서 오늘 달라진 것 하나를 찾아보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"작은 수수께끼",a:"🗝️",h:"나눌수록 작아지지 않고\\n오히려 커질 수 있는 것은?",b:"지식이나 친절이 좋은 답이 될 수 있어요. 나누는 과정에서 상대도 배우고 나 자신도 더 명확히 이해할 수 있죠.",x:"오늘 아는 것 하나를 누군가에게 친절하게 알려주세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"감각 깨우기",a:"🍋",h:"신맛을 상상하는 것만으로도\\n입안에 침이 고일 수 있어요.",b:"음식에 대한 생각과 기대는 실제 신체 반응을 일으킬 수 있습니다. 마음과 몸은 서로 영향을 주고받아요.",x:"지금 떠오르는 좋아하는 음식 하나를 생각해 보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"하늘의 변화",a:"🌈",h:"무지개는 태양과 물방울,\\n관찰자의 위치가 함께 만들어내요.",b:"햇빛이 물방울 안에서 굴절하고 반사되며 색으로 나뉘어 보입니다. 그래서 관찰자마다 보는 무지개가 조금씩 달라요.",x:"비가 그친 뒤 햇빛이 난다면 하늘을 한 번 올려다보세요.",w:"#e2edf8"},
{c:"호기심 발견",e:"마지막 발견",a:"🔍",h:"호기심은 특별한 재능보다\\n좋은 질문에서 시작되기도 해요.",b:"‘왜 그럴까?’라는 질문은 익숙한 것을 새롭게 보게 합니다. 답을 바로 찾지 못해도 질문 자체가 배움의 시작이에요.",x:"오늘 주변의 당연한 것 하나에 ‘왜?’라고 물어보세요.",w:"#e2edf8"},
{c:"공감과 위로",e:"괜찮다는 말",a:"🌿",h:"오늘 아무것도 해내지 못했어도\\n당신의 가치가 줄어든 건 아니에요.",b:"사람의 가치는 하루의 생산성이나 성과 하나로 결정되지 않아요. 쉬어야 다시 걸을 수 있는 날도 있습니다.",x:"오늘의 나에게 “여기까지도 수고했어”라고 말해보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"관계의 거리",a:"🫶",h:"모든 사람에게 이해받으려 하면\\n내 마음이 너무 바빠져요.",b:"서로 다른 경험과 기준을 가진 모든 사람을 설득할 수는 없어요. 나를 존중하는 사람과의 관계에 에너지를 남겨두세요.",x:"오늘은 설명을 반복하느라 지친 대화 하나를 잠시 멈춰도 돼요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"지친 마음",a:"🌧️",h:"괜찮은 척하지 않아도\\n괜찮은 날이 있어요.",b:"힘든 감정을 인정한다고 해서 약해지는 건 아니에요. 감정에 이름을 붙이는 것만으로도 내 상태를 이해하는 데 도움이 될 수 있어요.",x:"지금 감정을 한 단어로 표현해 보세요. 이유는 나중에 찾아도 돼요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"비교에서 벗어나기",a:"🌱",h:"남의 하이라이트와\\n내 평범한 하루를 비교하지 마세요.",b:"우리는 다른 사람의 삶에서 잘 드러나는 장면만 보는 경우가 많아요. 보이지 않는 과정까지 포함해 비교하기는 어렵습니다.",x:"오늘 내가 해낸 작고 평범한 일 하나를 적어보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"실수와 성장",a:"🪴",h:"실수한 나를 미워하는 대신\\n다음 선택을 조금 바꿔보세요.",b:"자책은 과거를 되돌리지 못하지만, 구체적인 교훈은 다음 행동에 도움이 될 수 있어요. 잘못을 인정하는 것과 자신을 모욕하는 건 다릅니다.",x:"실수에서 배운 점 하나와 다음에 할 행동 하나를 정해보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"혼자 있는 시간",a:"🌙",h:"혼자 있는 시간과\\n외로운 마음은 같은 게 아니에요.",b:"혼자 있는 시간이 충전이 될 수도, 외로움이 될 수도 있어요. 지금 내게 필요한 것이 휴식인지 연결인지 살펴보세요.",x:"혼자 쉬고 싶다면 편하게 쉬고, 누군가 그립다면 안부를 건네보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"마음의 경계",a:"🚪",h:"‘아니요’라고 말하는 건\\n상대를 미워한다는 뜻이 아니에요.",b:"모든 부탁을 받아들이면 내 시간과 에너지가 사라질 수 있어요. 정중하고 분명한 거절은 관계를 오래 유지하는 데 도움이 되기도 합니다.",x:"어려운 부탁을 받았다면 바로 답하지 말고 생각할 시간을 가져보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"다시 시작",a:"🌤️",h:"다시 시작하기에\\n너무 늦은 오늘은 없어요.",b:"처음부터 완벽하게 할 필요는 없습니다. 지금 할 수 있는 가장 작은 단계가 있다면 그걸로 시작해도 충분해요.",x:"미뤄둔 일 하나를 2분만 시작해 보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"마음의 짐",a:"🎒",h:"모든 문제를 오늘\\n한꺼번에 해결할 필요는 없어요.",b:"문제를 나누면 지금 다룰 수 있는 것과 기다려야 하는 것을 구분하기 쉬워져요. 순서를 정하는 것도 해결의 일부입니다.",x:"걱정 하나를 적고, 오늘 할 수 있는 한 단계만 표시해 보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"자기 존중",a:"🪞",h:"자신에게도 친구에게 하듯\\n말해줄 수 있나요?",b:"친구의 실수에는 사정을 이해하면서 내 실수에는 가혹할 때가 있어요. 나에게도 공정한 태도를 연습해 볼 수 있습니다.",x:"오늘 자신을 비난하는 말을 하나 발견하면 더 공정한 표현으로 바꿔보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"불안한 순간",a:"🍃",h:"아직 일어나지 않은 일을\\n지금 전부 겪을 필요는 없어요.",b:"미래를 준비하는 건 중요하지만, 상상 속의 모든 나쁜 결과를 현재의 현실처럼 느끼면 지치기 쉽습니다.",x:"걱정이 올라오면 ‘지금 실제로 일어난 일은 무엇이지?’라고 물어보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"마음의 회복",a:"🩹",h:"회복은 늘 직선으로\\n진행되지 않을 수 있어요.",b:"좋아졌다가 다시 힘들어지는 날이 있다고 해서 모든 노력이 사라진 건 아니에요. 변화에는 오르내림이 있을 수 있습니다.",x:"오늘 힘들다면 이전에 해낸 것까지 부정하지 마세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"고마움의 발견",a:"☀️",h:"큰 행복이 없어도\\n작은 편안함은 발견할 수 있어요.",b:"따뜻한 물, 편한 의자, 반가운 메시지처럼 작고 구체적인 경험에 주의를 기울이면 하루의 다른 면을 발견할 수 있어요.",x:"지금 괜찮은 것 하나를 구체적으로 찾아보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"관계의 이해",a:"💬",h:"상대가 내 마음을 알아주길 바라기 전에\\n내 마음을 설명해 보세요.",b:"가까운 사람도 내 생각을 자동으로 알 수는 없어요. 비난보다 구체적인 감정과 바람을 말하면 대화가 쉬워질 수 있습니다.",x:"‘당신은 항상’ 대신 ‘나는 이럴 때 이렇게 느껴’로 시작해 보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"놓아주기",a:"🍂",h:"끝난 일을 계속 떠올린다고\\n결말이 바뀌지는 않아요.",b:"과거를 돌아보는 건 배움이 될 수 있지만, 같은 장면을 반복해서 되새기는 것만으로 해결되는 일은 많지 않아요.",x:"생각이 반복되면 지금 할 수 있는 행동 하나로 시선을 옮겨보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"충분함",a:"🫖",h:"오늘은 더 잘하는 것보다\\n충분히 하는 것이 목표여도 돼요.",b:"모든 일을 최고 수준으로 해내려 하면 에너지가 금방 바닥날 수 있어요. 중요한 일에 힘을 남기기 위해 기준을 조절해도 됩니다.",x:"오늘 꼭 완벽하지 않아도 되는 일 하나를 정해보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"용기의 모양",a:"🦋",h:"용기는 두렵지 않은 상태가 아니라\\n두려워도 한 걸음 가는 것일 수 있어요.",b:"두려움이 사라질 때까지 기다리지 않아도 됩니다. 다만 위험을 무시하라는 뜻은 아니에요. 준비하고 도움을 구하는 것도 용기입니다.",x:"작고 안전한 다음 단계 하나를 정해보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"내 속도",a:"🐚",h:"다른 사람의 속도가\\n내가 따라야 할 속도는 아니에요.",b:"출발점과 조건, 책임이 다르면 속도도 달라집니다. 내게 맞는 속도를 찾는 것이 오래 가는 데 도움이 돼요.",x:"오늘은 내 일정에 현실적으로 맞는 속도를 정해보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"마음의 휴식",a:"🪟",h:"잠깐 멈춘다고\\n뒤처지는 건 아니에요.",b:"휴식은 계속 움직이기 위한 회복의 일부입니다. 피곤한 상태에서 무작정 밀어붙이는 것이 언제나 효율적인 건 아니죠.",x:"화면에서 눈을 떼고 먼 곳을 20초 바라보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"사과와 용서",a:"🤝",h:"사과는 책임을 인정하는 일이고\\n용서는 별개의 선택이에요.",b:"누군가에게 사과했다고 해서 상대가 즉시 용서해야 하는 것은 아니에요. 반대로 용서하지 못한다고 해서 회복할 수 없는 것도 아닙니다.",x:"관계에서 필요한 것이 사과인지, 경계인지, 시간이 필요한지 생각해 보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"나를 돌보기",a:"🧴",h:"나를 돌보는 일은\\n거창한 계획일 필요가 없어요.",b:"물 한 잔, 짧은 산책, 제때 잠자리에 들기처럼 작은 행동도 일상의 기반이 됩니다. 작아서 하찮은 것은 아니에요.",x:"지금 내 몸이 원하는 기본적인 것 하나를 챙겨보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"변화의 여지",a:"🌼",h:"지금의 모습이\\n앞으로의 전부는 아니에요.",b:"사람은 새로운 경험과 연습을 통해 배우고 달라질 수 있어요. 오늘의 어려움이 미래를 전부 결정하지는 않습니다.",x:"앞으로 조금 달라지고 싶은 점 하나를 작게 적어보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"말하지 못한 마음",a:"💌",h:"도움을 요청하는 것도\\n자신을 지키는 방법이에요.",b:"혼자 감당하기 어려운 일은 신뢰하는 사람이나 전문가와 나눌 수 있어요. 도움을 받는 건 능력이 부족하다는 증거가 아닙니다.",x:"필요하다면 누구에게 어떤 도움을 청할지 한 문장으로 적어보세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"오늘의 마무리",a:"🌌",h:"오늘의 부족함까지 안고\\n하루를 마쳐도 괜찮아요.",b:"하루는 늘 미완성인 채로 끝납니다. 내일 이어서 할 수 있는 일을 남겨두는 것도 자연스러운 삶의 방식이에요.",x:"내일 할 일 하나만 적고 오늘은 잠시 내려놓으세요.",w:"#f5e3e5"},
{c:"공감과 위로",e:"마지막 위로",a:"🕊️",h:"당신은 늘 강할 필요가 없어요.\\n가끔은 쉬어도 됩니다.",b:"강함은 버티는 것만을 뜻하지 않아요. 멈추고, 도움을 구하고, 다시 시작할 힘을 모으는 것도 강함의 한 모습입니다.",x:"이 카드가 필요한 사람에게 조용히 보내도 좋아요.",w:"#f5e3e5"},
{c:"작은 깨달음",e:"작은 시작",a:"🌱",h:"큰 변화는 종종\\n작은 반복에서 시작돼요.",b:"한 번의 대단한 결심보다 부담 없이 반복할 수 있는 행동이 습관으로 이어지기 쉽습니다. 작게 시작하면 다시 시작하기도 쉬워요.",x:"매일 2분 안에 할 수 있는 행동 하나를 골라보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"집중의 기술",a:"🎯",h:"모든 일을 동시에 하는 대신\\n지금 하나만 해보세요.",b:"주의를 여러 곳으로 옮기면 다시 집중하는 데 시간이 들 수 있어요. 한 번에 하나씩 처리하는 방식이 더 편한 순간도 많습니다.",x:"다음 5분 동안 알림을 끄고 한 가지 일만 해보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"시간의 사용",a:"⏳",h:"시간이 없을 때는\\n무엇을 하지 않을지도 중요해요.",b:"우선순위는 할 일을 고르는 것뿐 아니라 덜 중요한 일을 뒤로 미루는 선택이기도 합니다.",x:"오늘 하지 않아도 되는 일 하나를 정해보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"자연의 리듬",a:"🌊",h:"바다는 밀려왔다가\\n다시 물러갑니다.",b:"자연에는 반복되는 리듬이 있어요. 우리 생활에도 활동과 휴식, 집중과 회복의 균형이 필요합니다.",x:"일을 마친 뒤 1분간 아무것도 하지 않는 시간을 만들어 보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"선택의 힘",a:"🧭",h:"모든 것을 통제할 수 없어도\\n다음 행동은 고를 수 있어요.",b:"상황 자체를 바꾸기 어려울 때도 대응 방식이나 도움을 구하는 방법은 선택할 수 있습니다. 선택할 수 있는 범위를 찾는 게 시작이에요.",x:"걱정 하나를 ‘내가 할 수 있는 것’과 ‘없는 것’으로 나눠보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"관계의 온도",a:"☕",h:"좋은 관계는 대단한 말보다\\n작은 관심으로 자라기도 해요.",b:"안부 묻기, 약속 지키기, 이야기를 끝까지 듣기처럼 반복되는 작은 행동이 신뢰를 쌓습니다.",x:"오늘 한 사람에게 진심으로 안부를 물어보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"배움의 태도",a:"📚",h:"모른다는 사실을 인정하면\\n배울 자리가 생겨요.",b:"모르는 것을 숨기느라 에너지를 쓰기보다 질문하면 더 정확하게 이해할 기회가 생깁니다.",x:"오늘 모르는 것 하나를 편하게 질문해 보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"돈과 가치",a:"🪙",h:"싸게 사는 것과\\n잘 사는 것은 다를 수 있어요.",b:"가격뿐 아니라 사용 빈도, 내구성, 유지비, 실제 필요를 함께 보면 더 나은 선택을 할 수 있습니다.",x:"최근 구매한 물건 하나가 실제로 얼마나 쓰이는지 생각해 보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"쉼의 기술",a:"🍵",h:"쉬는 시간에도\\n성과를 내야 한다고 생각하지 마세요.",b:"휴식은 무언가를 생산해야만 가치 있는 시간이 아닙니다. 잠시 멈추는 그 자체가 목적일 수 있어요.",x:"타이머 1분을 맞추고 그동안 아무것도 완성하려 하지 마세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"꾸준함",a:"🐜",h:"작은 걸음도\\n방향이 맞으면 의미가 있어요.",b:"속도만큼 방향과 지속 가능성도 중요합니다. 너무 무리해서 오래 멈추는 것보다 작게 이어가는 편이 나을 수 있어요.",x:"목표를 오늘 가능한 크기로 줄여보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"마음의 정리",a:"🗒️",h:"머릿속 걱정은\\n종이에 적으면 다루기 쉬워질 수 있어요.",b:"생각을 글로 옮기면 막연한 걱정을 구체적인 항목으로 볼 수 있습니다. 적는다고 모든 문제가 해결되는 건 아니지만 시작점이 될 수 있어요.",x:"걱정 하나를 적고 다음 행동을 한 줄로 써보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"좋은 질문",a:"❔",h:"‘왜 안 될까?’에서\\n‘어떻게 작게 해볼까?’로.",b:"문제의 원인을 찾는 것도 중요하지만, 실험할 수 있는 작은 행동을 찾으면 움직이기 쉬워질 수 있어요.",x:"막힌 일 하나를 10분짜리 실험으로 바꿔보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"자연과 함께",a:"🌿",h:"자연을 바라보는 몇 분이\\n생각의 속도를 늦춰줄 수 있어요.",b:"자연을 경험하는 것이 일부 사람에게 스트레스 완화와 기분 전환에 도움이 될 수 있다는 연구가 있습니다. 개인차는 있어요.",x:"창밖의 나무나 하늘을 1분간 바라보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"생활의 단순화",a:"🧺",h:"물건이 줄면\\n돌봐야 할 것도 줄어들 수 있어요.",b:"소유는 편리함을 주지만 관리할 일도 함께 가져옵니다. 내게 실제로 쓰임이 있는 물건을 남기는 것이 중요해요.",x:"눈에 보이는 물건 하나를 제자리에 놓아보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"디지털 휴식",a:"📵",h:"잠깐 화면을 내려놓으면\\n주변이 다시 보일 수 있어요.",b:"화면은 많은 정보를 주지만 주변 감각을 놓치게 할 때도 있습니다. 잠깐 쉬는 시간을 직접 정해도 좋아요.",x:"다음 3분 동안 휴대폰을 내려놓고 주변 소리와 빛을 느껴보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"작은 친절",a:"🌷",h:"친절은 거창하지 않아도\\n하루의 분위기를 바꿀 수 있어요.",b:"문 잡아주기, 감사 인사, 차분히 듣기 같은 작은 행동도 상대에게 존중받는 느낌을 줄 수 있습니다.",x:"오늘 고마운 사람에게 구체적으로 감사한 점을 말해보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"실행의 문턱",a:"👟",h:"운동할 마음이 없다면\\n신발만 신어도 시작이에요.",b:"시작 행동을 작게 만들면 부담이 줄어듭니다. 꼭 계획한 만큼 해야 성공인 것은 아니에요.",x:"미뤄둔 일의 가장 작은 시작 동작을 해보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"관점 바꾸기",a:"🔄",h:"문이 닫혔다면\\n잠깐 다른 길을 살펴볼 수 있어요.",b:"대안이 항상 바로 보이는 건 아니지만, 한 가지 방법만 고집하지 않으면 선택지가 늘어날 수 있습니다.",x:"막힌 문제에 대해 다른 방법을 두 가지 적어보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"오늘의 감사",a:"🌞",h:"감사는 힘든 일을\\n없었던 일로 만드는 게 아니에요.",b:"감사할 것을 찾는다고 어려움을 부정할 필요는 없습니다. 힘든 현실과 고마운 순간은 동시에 존재할 수 있어요.",x:"오늘 어려웠던 일 하나와 고마웠던 일 하나를 함께 적어보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"휴식의 경계",a:"🛋️",h:"쉬는 시간은\\n남는 시간이 아니라 필요한 시간이에요.",b:"휴식을 계속 뒤로 미루면 회복할 기회가 줄어들 수 있어요. 일정을 짤 때 쉬는 시간도 함께 넣어보세요.",x:"오늘 일정에 짧은 휴식 한 번을 미리 표시해 보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"나만의 기준",a:"🪴",h:"남들이 좋다고 하는 것보다\\n내게 맞는 것이 중요할 때가 있어요.",b:"유행이나 타인의 기준은 참고가 될 수 있지만, 내 생활과 가치에 맞는지 확인해야 합니다.",x:"최근 선택 하나를 ‘내가 원해서인지, 남이 원해서인지’ 돌아보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"한 번 더 보기",a:"🔎",h:"익숙한 길에서도\\n새로운 것을 발견할 수 있어요.",b:"주의를 조금 바꾸면 늘 지나던 길의 나무, 간판, 빛의 모양이 눈에 들어옵니다. 새로움은 관찰에서 시작되기도 해요.",x:"오늘 가는 길에서 평소 보지 않던 것 하나를 찾아보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"내일을 위한 준비",a:"🌙",h:"내일의 나를 돕는\\n작은 준비 하나면 충분해요.",b:"필요한 물건을 미리 두거나 첫 번째 할 일을 적어두면 다음 날 시작이 조금 쉬워질 수 있습니다.",x:"내일 아침의 나를 위해 1분만 준비해 보세요.",w:"#e0eee7"},
{c:"작은 깨달음",e:"마지막 여유",a:"🌅",h:"오늘을 잘 보냈다는 건\\n모든 일을 끝냈다는 뜻이 아니에요.",b:"하루에는 늘 끝나지 않은 일이 남습니다. 중요한 것은 모든 것을 끝내는 것만이 아니라 오늘의 삶도 함께 살아내는 거예요.",x:"이제 화면을 닫고, 당신의 하루로 돌아가도 좋아요.",w:"#e0eee7"}
];
const cats=["전체","재미와 웃음","호기심 발견","공감과 위로","작은 깨달음"];
let current=0, filter="전체", view="feed";
const readSet=k=>{try{return new Set(JSON.parse(localStorage.getItem(k)||"[]"))}catch{return new Set()}};
let liked=readSet("jj_liked"),saved=readSet("jj_saved"),seen=readSet("jj_seen");
const persist=()=>{localStorage.setItem("jj_liked",JSON.stringify([...liked]));localStorage.setItem("jj_saved",JSON.stringify([...saved]));localStorage.setItem("jj_seen",JSON.stringify([...seen]))};
const $=id=>document.getElementById(id);
function pool(){return items.map((x,i)=>i).filter(i=>filter==="전체"||items[i].c===filter)}
function renderChips(){$("chips").innerHTML=cats.map(c=>`<button class="chip ${filter===c?"active":""}" data-cat="${c}">${c}</button>`).join("");$("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.cat;renderChips();const p=pool();if(!p.includes(current))current=p[0]??0;renderCard()})}
function renderCard(){const it=items[current];seen.add(current);persist();$("categoryTag").textContent=it.c;$("countText").textContent=String(current+1).padStart(2,"0")+" / 100";$("art").textContent=it.a;$("eyebrow").textContent=it.e;$("headline").textContent=it.h.replaceAll("\\n","\n");$("bodycopy").textContent=it.b;$("tinyaction").textContent="오늘의 작은 제안 · "+it.x;$("contentCard").style.setProperty("--wash",it.w);$("likeBtn").classList.toggle("on",liked.has(current));$("likeBtn").innerHTML=(liked.has(current)?"♥":"♡")+" <span>"+(liked.has(current)?"좋아하는 중":"좋아요")+"</span>";$("saveBtn").classList.toggle("on",saved.has(current));$("saveBtn").innerHTML=(saved.has(current)?"✓":"♧")+" <span>"+(saved.has(current)?"저장됨":"저장")+"</span>";$("welcomeText").textContent=seen.size<=1?"오늘은 어떤 순간이 필요하세요?":`오늘 ${seen.size}개의 순간을 만났어요. 서두르지 않아도 괜찮아요.`}
function next(){let p=pool();if(p.length<2){current=p[0]??0;renderCard();return}let options=p.filter(i=>i!==current);current=options[Math.floor(Math.random()*options.length)];renderCard()}
function toast(msg){$("toast").textContent=msg;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1600)}
$("nextBtn").onclick=next;$("shuffleBtn").onclick=()=>{next();toast("새로운 순간을 골랐어요")};
$("likeBtn").onclick=()=>{if(liked.has(current)){liked.delete(current);toast("좋아요를 취소했어요")}else{liked.add(current);toast("마음에 드는 순간으로 표시했어요")}persist();renderCard()};
$("saveBtn").onclick=()=>{if(saved.has(current)){saved.delete(current);toast("저장을 취소했어요")}else{saved.add(current);toast("나중에 다시 볼 수 있게 저장했어요")}persist();renderCard()};
function makeList(ids,container,empty){const el=$(container);if(!ids.length){el.innerHTML=`<div class="empty">${empty}</div>`;return}el.innerHTML=ids.map(i=>`<button class="saveditem" data-id="${i}"><span class="smalltag">${items[i].a} ${items[i].c} · ${String(i+1).padStart(2,"0")}/100</span><strong>${items[i].h.replaceAll("\\n","<br>")}</strong><small>${items[i].b}</small></button>`).join("");el.querySelectorAll("button").forEach(b=>b.onclick=()=>{current=Number(b.dataset.id);filter="전체";renderChips();showView("feed");renderCard()})}
function showView(v){view=v;$("feedView").classList.toggle("hidden",v!=="feed");$("savedView").classList.toggle("hidden",v!=="saved");$("likedView").classList.toggle("hidden",v!=="liked");document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.view===v));if(v==="saved")makeList([...saved].sort((a,b)=>b-a),"savedList","아직 저장한 콘텐츠가 없어요.<br>마음에 드는 카드를 저장해 보세요.");if(v==="liked")makeList([...liked].sort((a,b)=>b-a),"likedList","아직 좋아요를 누른 콘텐츠가 없어요.<br>마음에 드는 순간을 만나면 하트를 눌러주세요.");}
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>showView(b.dataset.view));
let touchStart=null;const card=$("contentCard");card.addEventListener("touchstart",e=>{touchStart=e.changedTouches[0].clientY},{passive:true});card.addEventListener("touchend",e=>{if(touchStart===null)return;let dy=e.changedTouches[0].clientY-touchStart;if(Math.abs(dy)>65){if(dy<0)next();else{let p=pool(),idx=p.indexOf(current);current=p[(idx-1+p.length)%p.length]??0;renderCard()}}touchStart=null},{passive:true});
document.addEventListener("keydown",e=>{if(view!=="feed")return;if(e.key==="ArrowDown"||e.key==="ArrowRight")next();if(e.key==="ArrowUp"||e.key==="ArrowLeft"){let p=pool(),idx=p.indexOf(current);current=p[(idx-1+p.length)%p.length]??0;renderCard()}});
renderChips();renderCard();
</script>
</body></html>
